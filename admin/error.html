<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minutics — Page not found</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="/fonts/marketing.css" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E7; --paper:#FCFAF4; --ink:#1D1A15; --ink-soft:#6E6656;
    --ink-faint:#A79E8C; --brass:#BF8A2D; --brass-deep:#8B6321; --hairline:#E4DCC8;
    --display:'Fraunces', ui-serif, Georgia, serif;
    --body:'Inter', ui-sans-serif, system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--cream); color:var(--ink); font-family:var(--body);
    -webkit-font-smoothing:antialiased; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .wrap{max-width:520px}
  .mark{
    width:54px; height:54px; border-radius:50%; margin:0 auto 26px;
    background:radial-gradient(circle at 32% 30%, var(--brass), var(--brass-deep));
    box-shadow:0 0 0 1px var(--hairline), 0 10px 30px rgba(139,99,33,.18);
    position:relative;
  }
  .mark::after{
    content:""; position:absolute; left:50%; top:50%; width:2px; height:15px;
    background:var(--paper); transform-origin:bottom center;
    transform:translate(-50%,-100%) rotate(38deg); border-radius:2px;
  }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--brass-deep); margin:0 0 14px;
  }
  h1{font-family:var(--display); font-weight:500; font-size:clamp(34px,6vw,52px); line-height:1.08; margin:0}
  p{margin:18px 0 0; color:var(--ink-soft); font-size:16px; line-height:1.65}
  .btn{
    display:inline-flex; align-items:center; gap:9px; margin-top:34px;
    font-family:var(--body); font-weight:600; font-size:15px; text-decoration:none;
    background:var(--ink); color:var(--paper); border:1px solid transparent;
    border-radius:999px; padding:14px 26px; cursor:pointer;
    transition:transform .35s cubic-bezier(.16,.84,.32,1), background .25s ease;
  }
  .btn:hover{background:var(--brass-deep); transform:translateY(-2px)}
  .foot{
    margin-top:46px; font-family:var(--mono); font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink-faint);
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="mark" aria-hidden="true"></div>
    <div class="eyebrow">Error 404</div>
    <h1>This page doesn't exist.</h1>
    <p>The address you opened isn't part of Minutics. Nothing is broken — it just isn't here.</p>
    <a class="btn" href="https://app.minutics.com">Go home</a>
    <div class="foot">Minutics — make every minute count</div>
  </main>
</body>
</html>
