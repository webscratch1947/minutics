name: Telegram report cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger report server
        run: |
          curl -fsS --retry 3 --retry-delay 10 -m 45 \
            "https://app.minutics.com/api/telegram?action=cron"
