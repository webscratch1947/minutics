<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <style>
      body { padding-bottom: env(safe-area-inset-bottom, 0px); padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; background: #Fdfbf7; }
      .fixed.bottom-0 { padding-bottom: env(safe-area-inset-bottom, 0px) !important; }
      #root { display: none; background: #Fdfbf7; }
      body.lt-authed #root { display: block; }
      /* Neutral grey from the very first paint — no white flash, no branding
         while the bundle loads. Fades via hideBootSplash() when a real screen
         is ready; the CSS animation is an independent failsafe (never stuck). */
      #lt-boot-splash { position: fixed; inset: 0; z-index: 2147483646; background: #3a3a3a; pointer-events: none; opacity: 1; transition: opacity .45s ease; animation: lt-boot-failsafe .45s ease 5s forwards; }
      @keyframes lt-boot-failsafe { to { opacity: 0; visibility: hidden; } }
    </style>
    <title>Minutics</title>
    <meta name="description" content="Minutics — Make every minute count." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Minutics" />
    <meta property="og:description" content="Minutics — Make every minute count." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minutics" />
    <meta name="twitter:description" content="Minutics — Make every minute count." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./assets/icons/logo-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="video" href="/assets/lt/minutics_splash.mp4" type="video/mp4" />
    <meta name="theme-color" content="#1a2140" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="module" src="./src/enhancements.js"></script>
    <script type="module" src="./src/auth.js"></script>
    <script type="module" crossorigin src="./src/main.js"></script>
    <link rel="stylesheet" href="./src/styles/main.css">
  </head>
  <body>
    <div id="lt-boot-splash"></div>
    <div id="root"></div>
  </body>
</html>
