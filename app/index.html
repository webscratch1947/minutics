<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <style>
      body { padding-bottom: env(safe-area-inset-bottom, 0px); padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; background: #Fdfbf7; }
      .fixed.bottom-0 { padding-bottom: env(safe-area-inset-bottom, 0px) !important; }
      #root { display: none; background: #Fdfbf7; }
      body.lt-authed #root { display: block; }
      /* First-paint boot splash: navy screen + pulsing logo, paints before any JS. */
      #lt-boot-splash { position: fixed; inset: 0; z-index: 2147483646; background: #0b1020; display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
      #lt-boot-splash img { width: 84px; height: 84px; border-radius: 50%; animation: ltBootPulse 1.1s ease-in-out infinite; box-shadow: 0 0 44px rgba(0,194,168,.35); }
      @keyframes ltBootPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
    </style>
    <script>
      /* Failsafe: never let the boot splash trap the user. Auth removes it
         sooner; this just covers a stuck/crashed init. */
      setTimeout(function () {
        var b = document.getElementById('lt-boot-splash');
        if (b) { b.style.opacity = '0'; setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 450); }
      }, 8000);
    </script>
    <title>Minutics</title>
    <meta name="description" content="Minutics — Make every minute count." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Minutics" />
    <meta property="og:description" content="Minutics — Make every minute count." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minutics" />
    <meta name="twitter:description" content="Minutics — Make every minute count." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./assets/icons/logo-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a2140" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="./src/enhancements.js"></script>
    <script type="module" src="./src/auth.js"></script>
    <script type="module" crossorigin src="./src/main.js"></script>
    <link rel="stylesheet" href="./src/styles/main.css">
  </head>
  <body>
    <div id="lt-boot-splash"><img src="./assets/icons/logo-192.png" alt="Minutics" /></div>
    <div id="root"></div>
  </body>
</html>
