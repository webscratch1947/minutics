<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <style>
      body { padding-bottom: env(safe-area-inset-bottom, 0px); padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; background: #Fdfbf7; }
      .fixed.bottom-0 { padding-bottom: env(safe-area-inset-bottom, 0px) !important; }
      #root { display: none; background: #Fdfbf7; }
      body.lt-authed #root { display: block; }
      /* Neutral cream at the very first paint â€” the user's own splash video
         is the ONLY splash. Fades via hideBootSplash() when a real screen
         is ready; the CSS animation is an independent failsafe (never stuck). */
      #lt-boot-splash { position: fixed; inset: 0; z-index: 2147483646; background: #FDFBF7; pointer-events: none; opacity: 1; transition: opacity .45s ease; animation: lt-boot-failsafe .45s ease 5s forwards; }
      @keyframes lt-boot-failsafe { to { opacity: 0; visibility: hidden; } }
    </style>
    <title>Minutics</title>
    <meta name="description" content="Minutics â€” Make every minute count." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Minutics" />
    <meta property="og:description" content="Minutics â€” Make every minute count." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minutics" />
    <meta name="twitter:description" content="Minutics â€” Make every minute count." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./assets/icons/logo-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a2140" />
    <!-- Fonts self-hosted (SRI-safe, no third-party request) -->
    <link href="/fonts/inter.css" rel="stylesheet">
    <!-- Review preview ONLY (localhost + ?onboarding=new): flag the bundle
         before any module runs and keep both splash layers unpainted, so
         the onboarding wizard is the first and only thing on screen.
         On the live site / in the APK this never matches (host gate) and
         does nothing at all. -->
    <script>
      (function () {
        try {
          var h = location.hostname;
          var local = h === "localhost" || h === "127.0.0.1" || h === "[::1]" || h === "";
          if (local && new URLSearchParams(location.search).get("onboarding") === "new") {
            window.__ltOnbPreview = true;
            var s = document.createElement("style");
            s.textContent = "#lt-boot-splash,#lt-startup-splash{display:none!important;}";
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="./src/enhancements.js"></script>
    <script type="module" src="./src/auth.js"></script>
    <script type="module" crossorigin src="./src/main.js"></script>
    <link rel="stylesheet" href="./src/styles/main.css">
  </head>
  <body>
    <div id="lt-boot-splash"></div>
    <!-- Splash: the coded Minutics emblem animation (traced 1:1 from the real
         logo). Static markup paints at HTML PARSE, before the app bundle, and
         the CSS animation runs straight from that first frame â€” nothing (no
         audio, no gating) ever delays or restarts it. The enhancements module
         adopts these exact ids and owns dismissal. -->
    <div id="lt-startup-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:2147483647;background:#FDFBF7;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;opacity:1;pointer-events:none;overflow:hidden;">
      <style>
        @font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/poppins-700-latin.woff2) format('woff2');}
        #lt-splash-logo{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 40px -12px rgba(1,37,83,.35);animation:ltSpLogo .9s cubic-bezier(.18,.86,.28,1) .1s both;}
        @keyframes ltSpLogo{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}
        #lt-splash-word{margin-top:22px;font:700 26px/1 'Poppins',system-ui,sans-serif;letter-spacing:.32em;color:#012553;opacity:0;animation:ltSpWord .7s ease 2.6s both;}
        @keyframes ltSpWord{from{opacity:0;letter-spacing:.42em}to{opacity:1;letter-spacing:.155em}}
        #lt-splash-tag{margin-top:10px;font:500 12px/1.4 'Poppins',system-ui,sans-serif;letter-spacing:.08em;color:#6B7280;opacity:0;animation:ltSpTag .6s ease 2.9s both;}
        @keyframes ltSpTag{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
        @media (prefers-reduced-motion:reduce){
          #lt-splash-logo,#lt-splash-word,#lt-splash-tag{animation:none!important;opacity:1!important;transform:none!important;}
        }
      </style>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <img id="lt-splash-logo" src="/assets/icons/logo-192.png" alt="" />
        <div id="lt-splash-word">MINUTICS</div>
        <div id="lt-splash-tag">Track your minutes</div>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('lt-startup-splash');
        if (!splash) return;
        var dismissed = false;
        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          splash.style.opacity = '0';
          setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 550);
        }
        window.__ltSplashDismiss = dismiss;
        window.__ltSplashPlaying = true;
        setTimeout(dismiss, 4000);
        setTimeout(dismiss, 7000);
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
