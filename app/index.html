<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <style>
      body { padding-bottom: env(safe-area-inset-bottom, 0px); padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; background: #Fdfbf7; }
      .fixed.bottom-0 { padding-bottom: env(safe-area-inset-bottom, 0px) !important; }
      #root { display: none; background: #Fdfbf7; }
      body.lt-authed #root { display: block; }
      /* Neutral cream at the very first paint — the user's own splash video
         is the ONLY splash. Fades via hideBootSplash() when a real screen
         is ready; the CSS animation is an independent failsafe (never stuck). */
      #lt-boot-splash { position: fixed; inset: 0; z-index: 2147483646; background: #FDFBF7; pointer-events: none; opacity: 1; transition: opacity .45s ease; animation: lt-boot-failsafe .45s ease 5s forwards; }
      @keyframes lt-boot-failsafe { to { opacity: 0; visibility: hidden; } }
    </style>
    <title>Minutics</title>
    <meta name="description" content="Minutics — Make every minute count." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Minutics" />
    <meta property="og:description" content="Minutics — Make every minute count." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Minutics" />
    <meta name="twitter:description" content="Minutics — Make every minute count." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./assets/icons/logo-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Video is cached immutable for 1y: bump ?v=N when replacing the file -->
    <link rel="preload" as="video" href="/assets/lt/minutics_splash.mp4?v=5" type="video/mp4" />
    <meta name="theme-color" content="#1a2140" />
    <!-- Fonts self-hosted (SRI-safe, no third-party request) -->
    <link href="/fonts/inter.css" rel="stylesheet">
    <script type="module" src="./src/enhancements.js"></script>
    <script type="module" src="./src/auth.js"></script>
    <script type="module" crossorigin src="./src/main.js"></script>
    <link rel="stylesheet" href="./src/styles/main.css">
  </head>
  <body>
    <div id="lt-boot-splash"></div>
    <!-- Splash bootstrap — runs at HTML PARSE: creates the splash + video so
         the 2.3MB video downloads in parallel with the app bundle. Before,
         the download only started AFTER the 900KB JS loaded/parsed/ran — on
         slower connections no frame ever made it before the 3s release
         ("the splash animation doesn't play sometimes"). The enhancements
         module adopts these exact elements (styles byte-identical) and owns
         playback/audio from there — visuals unchanged. -->
    <script>
      (function () {
        try {
          if (document.getElementById("lt-startup-splash")) return;
          var s = document.createElement("div");
          s.id = "lt-startup-splash";
          s.setAttribute("style", "position:fixed;inset:0;z-index:2147483647;background:#FDFBF7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s ease;opacity:1;pointer-events:none;overflow:hidden;");
          var v = document.createElement("video");
          v.id = "lt-startup-splash-video";
          v.src = "assets/lt/minutics_splash.mp4?v=5";
          v.autoplay = true;
          v.setAttribute("playsinline", "");
          v.setAttribute("webkit-playsinline", "");
          v.preload = "auto";
          v.loop = false;
          v.setAttribute("style", "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s ease;");
          s.appendChild(v);
          document.body.appendChild(s);
          /* Programmatic start WITH sound — the exact call the pre-adoption
             splash used (relying on attribute-autoplay alone let a single
             blocked/failed start latch into a MUTED fallback nothing ever
             retried: "the splash audio stopped coming"). Android's WebView
             allows it immediately (gesture requirement off) so the APK
             sounds from the first frame; desktop browsers reject it until
             a gesture and the enhancements module's own play() + first
             tap/click take over exactly as before. */
          try { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
