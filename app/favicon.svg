<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#000000"/>
  <!-- Clock circle arc (open at bottom-right, like the logo) -->
  <circle cx="90" cy="78" r="38" stroke="white" stroke-width="4.5" fill="none" stroke-dasharray="210 30" stroke-dashoffset="-15" stroke-linecap="round"/>
  <!-- Hour markers: top (12), left (9), right (3) -->
  <line x1="90" y1="44" x2="90" y2="52" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="78" x2="59" y2="78" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="121" y1="78" x2="128" y2="78" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Clock hand pointing to ~1 o'clock position -->
  <line x1="90" y1="78" x2="110" y2="58" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="90" cy="78" r="4" fill="white"/>
</svg>
